[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbh-scanner"
version = "0.4.0"
description = "BBH-Scanner: scanner recon 24/7 multi-piattaforma (HackerOne, ...)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "black>=24",
]

[project.scripts]
bbh = "bbh_scanner.cli:main"

[tool.setuptools]
packages = [
    "bbh_scanner",
    "bbh_scanner.db",
    "bbh_scanner.collectors",
    "bbh_scanner.recon",
    "bbh_scanner.active",
    "bbh_scanner.resources",
    "bbh_scanner.scheduler",
    "bbh_scanner.notify",
]
include-package-data = true

[tool.setuptools.package-data]
"bbh_scanner.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
